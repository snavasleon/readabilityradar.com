name: Build local applications

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            script: build:windows
            artifact: Web-Readability-Radar.exe
          - label: macOS Apple Silicon
            # pkg can cross-package the self-contained Node runtime.  Building
            # here avoids the scarce GitHub-hosted macOS runners.
            os: ubuntu-latest
            script: build:macos-apple-silicon
            artifact: Web-Readability-Radar-macos-arm64
          - label: macOS Intel
            os: ubuntu-latest
            script: build:macos-intel
            artifact: Web-Readability-Radar-macos-x64
          - label: Linux
            os: ubuntu-latest
            script: build:linux
            artifact: Web-Readability-Radar-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - name: Rename macOS binary
        if: matrix.label == 'macOS Apple Silicon' || matrix.label == 'macOS Intel'
        shell: bash
        run: mv dist/Web-Readability-Radar "dist/${{ matrix.artifact }}"
      - name: Package Linux application
        if: matrix.label == 'Linux'
        shell: bash
        run: |
          chmod +x dist/Web-Readability-Radar
          tar -C dist -czf "dist/${{ matrix.artifact }}" Web-Readability-Radar
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: dist/${{ matrix.artifact }}

  release:
    name: Publish packages
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Package macOS applications separately
        shell: bash
        run: |
          mkdir -p "release-assets/Web Readability Radar Apple Silicon.app/Contents/MacOS"
          mv release-assets/Web-Readability-Radar-macos-arm64 "release-assets/Web Readability Radar Apple Silicon.app/Contents/MacOS/Web Readability Radar"
          chmod +x "release-assets/Web Readability Radar Apple Silicon.app/Contents/MacOS/Web Readability Radar"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<plist version="1.0"><dict><key>CFBundleDisplayName</key><string>Web Readability Radar</string><key>CFBundleExecutable</key><string>Web Readability Radar</string><key>CFBundleIdentifier</key><string>com.readabilityradar.local-engine</string><key>CFBundlePackageType</key><string>APPL</string></dict></plist>' > "release-assets/Web Readability Radar Apple Silicon.app/Contents/Info.plist"
          (cd release-assets && zip -qry Web-Readability-Radar-macos-apple-silicon.app.zip "Web Readability Radar Apple Silicon.app")
          rm -rf "release-assets/Web Readability Radar Apple Silicon.app"
          mkdir -p "release-assets/Web Readability Radar Intel.app/Contents/MacOS"
          mv release-assets/Web-Readability-Radar-macos-x64 "release-assets/Web Readability Radar Intel.app/Contents/MacOS/Web Readability Radar"
          chmod +x "release-assets/Web Readability Radar Intel.app/Contents/MacOS/Web Readability Radar"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<plist version="1.0"><dict><key>CFBundleDisplayName</key><string>Web Readability Radar</string><key>CFBundleExecutable</key><string>Web Readability Radar</string><key>CFBundleIdentifier</key><string>com.readabilityradar.local-engine</string><key>CFBundlePackageType</key><string>APPL</string></dict></plist>' > "release-assets/Web Readability Radar Intel.app/Contents/Info.plist"
          (cd release-assets && zip -qry Web-Readability-Radar-macos-intel.app.zip "Web Readability Radar Intel.app")
          rm -rf "release-assets/Web Readability Radar Intel.app"
      - name: Write checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Attach all packages to the tagged release
        uses: softprops/action-gh-release@v2
        with:
          name: Web Readability Radar ${{ github.ref_name }} — aplicaciones locales
          body: |
            ## Aplicaciones locales de Web Readability Radar

            Esta versión permite ejecutar el análisis completo de dominios en el propio ordenador: sitemaps, enlaces internos, contenido dinámico y hasta 10.000 páginas candidatas. Los resultados se muestran en la web y el trabajo pesado permanece en el equipo de la persona usuaria.

            **Elige una descarga:**

            - **Windows (64 bits):** `Web-Readability-Radar.exe`
            - **Mac con chip Apple (M1, M2, M3, M4…):** `Web-Readability-Radar-macos-apple-silicon.app.zip`
            - **Mac Intel:** `Web-Readability-Radar-macos-intel.app.zip`
            - **Linux (64 bits):** `Web-Readability-Radar-linux-x64.tar.gz`

            En macOS, abre el menú Apple  → **Acerca de este Mac** si no sabes qué procesador tiene tu equipo.

            Las aplicaciones no están firmadas por Apple o Microsoft. El sistema puede solicitar una confirmación de apertura la primera vez. Se incluyen las huellas SHA-256 para verificar los archivos.
          files: release-assets/*
