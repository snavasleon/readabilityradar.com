name: Build Windows application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-release:
    name: Build and publish Windows application
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:windows
      - name: Write checksum
        shell: bash
        run: |
          cd dist
          sha256sum Web-Readability-Radar.exe > SHA256SUMS.txt
      - name: Publish Windows release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Web Readability Radar ${{ github.ref_name }} — Windows application
          body: |
            ## Web Readability Radar for Windows

            This portable Windows application runs complete-domain analysis on the user's own computer: sitemaps, internal links, dynamic content, and up to 10,000 candidate pages. Results appear in the website interface while the intensive work stays on the user's computer.

            Download `Web-Readability-Radar.exe`, open it, and then choose **Complete domain** at [readabilityradar.com](https://readabilityradar.com).

            Windows may ask you to confirm the first launch because the application is not code-signed. `SHA256SUMS.txt` is included to verify the downloaded file.
          files: |
            dist/Web-Readability-Radar.exe
            dist/SHA256SUMS.txt
