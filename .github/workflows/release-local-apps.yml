name: Build local applications

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            script: build:windows
            artifact: Web-Readability-Radar.exe
          - label: macOS Apple Silicon
            os: macos-14
            script: build:macos-apple-silicon
            artifact: Web-Readability-Radar-macos-apple-silicon.app.zip
          - label: Linux
            os: ubuntu-latest
            script: build:linux
            artifact: Web-Readability-Radar-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - name: Package macOS application
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          APP="dist/Web Readability Radar.app"
          mkdir -p "$APP/Contents/MacOS"
          mv dist/Web-Readability-Radar "$APP/Contents/MacOS/Web Readability Radar.bin"
          cat > "$APP/Contents/MacOS/Web Readability Radar" <<'LAUNCHER'
          #!/bin/sh
          APP_DIR="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$APP_DIR/Web Readability Radar.bin"
          LAUNCHER
          chmod +x "$APP/Contents/MacOS/Web Readability Radar" "$APP/Contents/MacOS/Web Readability Radar.bin"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDisplayName</key><string>Web Readability Radar</string>
            <key>CFBundleExecutable</key><string>Web Readability Radar</string>
            <key>CFBundleIdentifier</key><string>com.readabilityradar.local-engine</string>
            <key>CFBundleName</key><string>Web Readability Radar</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${{ github.ref_name }}</string>
          </dict></plist>
          PLIST
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/${{ matrix.artifact }}"
      - name: Package Linux application
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          chmod +x dist/Web-Readability-Radar
          tar -C dist -czf "dist/${{ matrix.artifact }}" Web-Readability-Radar
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: dist/${{ matrix.artifact }}

  release:
    name: Publish packages
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Write checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Attach all packages to the tagged release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
