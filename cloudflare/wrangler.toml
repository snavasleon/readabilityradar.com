name = "web-readability-radar"
main = "src/worker.js"
compatibility_date = "2026-10-19"

[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[routes]]
pattern = "readabilityradar.com"
custom_domain = true

[[routes]]
pattern = "www.readabilityradar.com"
custom_domain = true
